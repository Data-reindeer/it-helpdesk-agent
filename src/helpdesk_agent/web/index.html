<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IT Companion · Helpdesk Agent</title><link rel="stylesheet" href="/static/style.css"></head><body>
<aside><div class="brand"><span class="mark">iT</span> IT Companion</div><p class="muted">Employee support, with context.</p><label>演示员工身份<select id="employee" aria-label="演示员工身份"></select></label><button id="newSession">＋ 新会话</button><label>恢复会话<select id="sessions" aria-label="恢复会话"><option value="">选择会话</option></select></label><label>当前问题<select id="issues" aria-label="当前问题"></select></label><button id="newIssue">＋ 新问题</button><div class="aside-bottom"><span class="dot"></span> Local synthetic sandbox<p>合成数据 · 模拟执行<br>人工队列无人值守</p><small id="mode"></small></div></aside>
<main><header><div><small>WORKSPACE / IT SUPPORT</small><h1>让问题得到下一步。</h1></div><span id="status" class="badge">Ready</span></header><div id="error" role="alert" hidden></div><section id="chat" aria-live="polite"><div class="welcome"><h2>你好，有什么 IT 问题？</h2><p>描述症状、错误或影响。我会调查可用证据，提供安全的下一步。</p><div class="examples"><button data-example="我的 VPN 每隔 10–15 分钟就断开，远程办公无法访问内部工具。">VPN 反复断开 ↗</button><button data-example="I cannot log into Okta. I already reset my password but it still fails.">Okta 登录失败 ↗</button><button data-example="I joined Data Engineering and need Snowflake production reader access for a reporting project.">生产权限申请 ↗</button></div></div></section><section id="action" hidden></section><section id="verification" hidden><p>操作后，问题是否已恢复？</p><button id="recovered">已恢复</button><button id="failed">仍然失败</button></section><footer><form id="composer"><textarea id="message" rows="2" maxlength="4000" placeholder="描述你的 IT 问题… 请勿发送密码、验证码或密钥" aria-label="IT 问题" required></textarea><button id="send" type="submit">发送 ↑</button></form><div class="footer-row"><small>操作依据来自批准的知识库；恢复需要验证。</small><button id="handoff">人工协助</button><button id="export">导出记录</button></div></footer></main>
<section class="inspector"><h2>调查工作区</h2><p class="muted">证据、动作与交接保持可追踪。</p><div id="activity"></div><details open><summary>来源证据</summary><div id="evidence"></div></details><details><summary>候选诊断（未验证）</summary><pre id="hypotheses"></pre></details><details><summary>人工交接</summary><pre id="handoffData"></pre></details></section><script src="/static/app.js"></script></body></html>
